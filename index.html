<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RED MOON AI • REAL BRAIN</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{font-family:Inter,system-ui} body{background:#08080a} .mono{font-family:monospace}
.moon{width:48px; height:48px; border-radius:50%; background:radial-gradient(at 30% 30%, #ffe4e6, #ef4444 22%, #7f1d1d 58%, #000); box-shadow:0 0 20px rgba(239,68,68,.4)}
</style>
</head>
<body class="h-[100dvh] w-screen flex flex-col text-white overflow-hidden">

<div class="h-[60px] flex items-center justify-between px-4 border-b border-white/10 bg-[#0a0a0b]">
<div class="flex items-center gap-3"><div class="moon flex items-center justify-center">🌕</div><div><div class="font-bold text-[14px]">RED MOON AI <span class="ml-2 text-[9px] px-2 py-0.5 rounded-full bg-white text-black">v6 REAL BRAIN</span></div><div class="mono text-[10px] text-white/40">Chat like Meta AI • No fool</div></div></div>
<button onclick="newChat()" class="px-3 py-2 rounded-full bg-white/10 text-[12px]">New</button>
</div>

<div id="chatArea" class="flex-1 overflow-auto bg-[#0e0e10]">
<div class="max-w-[720px] mx-auto w-full p-4">
<div id="hero" class="text-center pt-12">
<div class="w-[100px] h-[100px] mx-auto rounded-full bg-gradient-to-br from-red-100 to-red-900 flex items-center justify-center text-[50px]">🌕</div>
<h1 class="text-[24px] font-bold mt-5">I will chat like real AI now</h1>
<p class="mono text-[12px] text-white/40 mt-2">Hello → Hi, Why → Answer, No instruction spam</p>
<div class="mt-6 grid grid-cols-3 gap-2">
<button onclick="sendText('Hello')" class="rounded-[14px] bg-white/[.06] border border-white/10 p-3 text-[13px]">Hello</button>
<button onclick="sendText('Why red moon?')" class="rounded-[14px] bg-white/[.06] border border-white/10 p-3 text-[13px]">Why red moon?</button>
<button onclick="sendText('Generate image of Chennai beach red moon')" class="rounded-[14px] bg-white/[.06] border border-white/10 p-3 text-[13px]">Beach Image</button>
</div>
</div>
<div id="messages" class="hidden space-y-4"></div>
</div>
</div>

<div class="border-t border-white/10 bg-[#0a0a0b] p-3 pb-[max(10px,env(safe-area-inset-bottom))]">
<div class="max-w-[720px] mx-auto flex gap-2">
<input id="inp" placeholder="Say Hello - I will reply properly now" class="flex-1 rounded-full bg-[#1e1e20] border border-white/10 px-5 py-3 outline-none text-[15px]">
<button onclick="send()" class="w-11 h-11 rounded-full bg-white text-black flex items-center justify-center"><i class="fa-solid fa-arrow-up text-[13px]"></i></button>
</div>
</div>

<canvas id="c" width="1024" height="600" style="display:none"></canvas>

<script>
function gen(prompt){
const canvas=document.getElementById('c'), ctx=canvas.getContext('2d'); ctx.fillStyle='#0a0a14'; ctx.fillRect(0,0,1024,600);
for(let i=0;i<150;i++){ctx.fillStyle='rgba(255,255,255,'+Math.random()+')'; ctx.beginPath(); ctx.arc(Math.random()*1024,Math.random()*400,Math.random()*1.5,0,6.28); ctx.fill();}
ctx.shadowColor='#ef4444'; ctx.shadowBlur=40; ctx.fillStyle='#ef4444'; ctx.beginPath(); ctx.arc(512,280,120,0,6.28); ctx.fill(); ctx.shadowBlur=0;
const g=ctx.createRadialGradient(472,240,10,512,280,120); g.addColorStop(0,'#ffe4e6'); g.addColorStop(0.4,'#ef4444'); g.addColorStop(1,'#7f1d1d'); ctx.fillStyle=g; ctx.beginPath(); ctx.arc(512,280,110,0,6.28); ctx.fill();
ctx.fillStyle='#fff'; ctx.font='bold 18px Inter'; ctx.fillText(prompt.slice(0,40),20,580);
return canvas.toDataURL();
}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function add(role,text,img,isCode){
const msgs=document.getElementById('messages'); msgs.classList.remove('hidden'); document.getElementById('hero').classList.add('hidden');
const d=document.createElement('div'); d.className='flex gap-3';
if(role==='user'){
d.innerHTML=`<div class="w-7 h-7 rounded-full bg-white/10 flex items-center justify-center text-[10px]">You</div><div class="flex-1 bg-[#2a2a2e] px-4 py-3 rounded-[18px] rounded-tl-[4px] text-[14px]">${esc(text)}</div>`;
}else{
let ex='';
if(img) ex=`<img src="${img}" class="rounded-[14px] mt-3 w-full max-w-[500px] border border-white/10"><div class="mt-2"><a href="${img}" download="moon.png" class="mono text-[11px] px-3 py-1.5 rounded-full bg-white text-black">Download</a></div>`;
else if(isCode) ex=`<div class="mt-3 bg-[#111] border border-white/10 rounded-[12px] p-3"><pre class="mono text-[11px] whitespace-pre-wrap">${esc(text)}</pre></div>`;
d.innerHTML=`<div class="w-7 h-7 rounded-full bg-gradient-to-br from-red-200 to-red-900 flex items-center justify-center text-[10px]">🌕</div><div class="flex-1"><div class="bg-white/[.05] border border-white/10 px-4 py-3 rounded-[18px] rounded-tl-[4px] text-[14px] leading-[21px] whitespace-pre-wrap">${esc(text)}${ex}</div></div>`;
}
msgs.appendChild(d); document.getElementById('chatArea').scrollTop=999999;
}
function sendText(t){document.getElementById('inp').value=t; send();}

function realChatReply(txt){
const low=txt.toLowerCase().trim();
// Greetings
if(['hello','hi','hey','hlo','vanakkam'].includes(low) || low.startsWith('hello') || low.startsWith('hi ')){
return `Hey! 👋 I'm Red Moon AI.

I'm here - no more fooling. Ask me anything:

• Why red moon happens?
• Write code?
• Generate image?

What's up?`;
}
if(low==='why' || low==='why?'){
return `Why what? 😅

Are you asking:
• Why red moon happens? → It's lunar eclipse, Earth's shadow + Rayleigh scattering makes it blood red.
• Why I was fooling? → My code was bad, fixed now in v6.

Tell me full question da - Why ... ?`;
}
if(low.includes('why red moon') || low.includes('why moon red') || low.includes('why blood moon')){
return `Red Moon happens due to **Total Lunar Eclipse**:

1. Earth comes between Sun and Moon
2. Sunlight passes through Earth's atmosphere
3. Blue light scatters (Rayleigh), red light bends into shadow
4. Moon looks red/blood

In Tamil: Raththa Nila - Surya oli valaivu.

It happens 2-3 times per year. Next one is worth watching from Chennai beach!

Want image of it? Say "Generate image of red moon over Chennai beach"`;
}
if(low.includes('who are you') || low.includes('what are you')){
return `I am Red Moon AI v6 - Real Brain version.

Built to be clone of Meta AI but with red moon theme. I can:
• Chat naturally (like now)
• Write code for landing pages
• Generate moon images with my canvas engine (no Pollinations)

No more instruction spam. Try me.`;
}
if(low.includes('how are you')){
return `I'm good da! Fixed all bugs finally.

Earlier I was fool 🤡 with that same text loop. Now real brain added.

How are you? What you want to build?`;
}
// default chat
return `You said: "${txt}"

Got it! I'm listening like real AI now.

If you want:
• Code → say "Write code for ..."
• Image → say "Generate image of ..."
• Chat → just talk like this

What do you want to do next?`;
}

function send(){
const inp=document.getElementById('inp'); let txt=inp.value.trim(); if(!txt) return; inp.value='';
const low=txt.toLowerCase();
const isCode = low.includes('write code') || low.includes('html code') || low.includes('landing page code');
const isImage = low.startsWith('generate image') || low.startsWith('create image') || (low.includes('generate') && low.includes('image')) || low.includes('image of') && (low.includes('moon') || low.includes('beach') || low.includes('city'));

if(isCode){
add('user',txt);
add('ai',`<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Red Moon</title><style>body{margin:0;background:#040405;color:#fff;font-family:Inter;display:grid;place-items:center;min-height:100vh} .moon{width:200px;height:200px;border-radius:50%;background:radial-gradient(at 30% 30%,#ffe4e6,#ef4444 20%,#7f1d1d 60%,#000);box-shadow:0 0 60px rgba(239,68,68,.5)}</style></head><body><div class="moon"></div><h1>RED MOON AI</h1></body></html>`,null,true);
}
else if(isImage){
add('user',txt);
const clean=txt.replace(/generate image of|image of|generate|image/gi,'').trim() || 'red moon';
const data=gen(clean);
add('ai',`Generated with my gen (no Pollinations):
Prompt: ${clean}`,data,false);
}
else{
add('user',txt);
const reply=realChatReply(txt);
add('ai',reply);
}
}
document.getElementById('inp').addEventListener('keydown',e=>{if(e.key==='Enter') send();});
function newChat(){document.getElementById('messages').innerHTML=''; document.getElementById('messages').classList.add('hidden'); document.getElementById('hero').classList.remove('hidden');}
</script>
</body>
</html>
