<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RED MOON AI • REAL FIX</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{font-family:Inter,system-ui} body{background:#08080a}
.mono{font-family:monospace}
.moon{width:48px; height:48px; border-radius:50%; background:radial-gradient(at 30% 30%, #ffe4e6, #ef4444 22%, #7f1d1d 58%, #000); box-shadow:0 0 20px rgba(239,68,68,.4)}
</style>
</head>
<body class="h-[100dvh] w-screen flex flex-col text-white overflow-hidden">

<div class="h-[60px] flex items-center justify-between px-4 border-b border-white/10 bg-[#0a0a0b]">
<div class="flex items-center gap-3"><div class="moon flex items-center justify-center">🌕</div><div><div class="font-bold text-[14px]">RED MOON AI <span class="ml-2 text-[9px] px-2 py-0.5 rounded-full bg-green-500/20 text-green-300 border border-green-500/30">REAL FIX v5</span></div><div class="mono text-[10px] text-white/40">Why=Chat • Code=Code • Image=Image</div></div></div>
<button onclick="newChat()" class="px-3 py-2 rounded-full bg-white/10 text-[12px]">New</button>
</div>

<div id="chatArea" class="flex-1 overflow-auto bg-[#0e0e10]">
<div class="max-w-[720px] mx-auto w-full p-4">
<div id="hero" class="text-center pt-12">
<div class="w-[100px] h-[100px] mx-auto rounded-full bg-gradient-to-br from-red-100 to-red-900 flex items-center justify-center text-[50px]">🌕</div>
<h1 class="text-[24px] font-bold mt-5">Real Fix - No Fool</h1>
<p class="mono text-[12px] text-white/40 mt-2">Why → Answer, Code → Code, Generate image → My Gen</p>
<div class="mt-6 grid grid-cols-3 gap-2 text-left">
<button onclick="demo('Why red moon happens?')" class="rounded-[14px] bg-white/[.06] border border-white/10 p-3"><div class="text-[13px] font-semibold">Why?</div><div class="mono text-[10px] text-white/40">Chat answer</div></button>
<button onclick="demo('Write code for red moon page')" class="rounded-[14px] bg-white/[.06] border border-white/10 p-3"><div class="text-[13px] font-semibold">Code</div><div class="mono text-[10px] text-white/40">HTML code</div></button>
<button onclick="demo('Generate image of red moon over beach')" class="rounded-[14px] bg-white/[.06] border border-white/10 p-3"><div class="text-[13px] font-semibold">Image</div><div class="mono text-[10px] text-white/40">My gen</div></button>
</div>
</div>
<div id="messages" class="hidden space-y-4"></div>
</div>
</div>

<div class="border-t border-white/10 bg-[#0a0a0b] p-3 pb-[max(10px,env(safe-area-inset-bottom))]">
<div class="max-w-[720px] mx-auto flex gap-2">
<input id="inp" placeholder="Try 'Why' - will chat, not image" class="flex-1 rounded-full bg-[#1e1e20] border border-white/10 px-5 py-3 outline-none text-[15px]">
<button onclick="send()" class="w-11 h-11 rounded-full bg-white text-black flex items-center justify-center"><i class="fa-solid fa-arrow-up text-[13px]"></i></button>
</div>
</div>

<canvas id="genCanvas" width="1024" height="600" style="display:none"></canvas>

<script>
function myGen(prompt){
const c=document.getElementById('genCanvas'), ctx=c.getContext('2d'), W=1024, H=600;
ctx.fillStyle='#08080f'; ctx.fillRect(0,0,W,H);
for(let i=0;i<200;i++){ctx.fillStyle=`rgba(255,255,255,${Math.random()})`; ctx.beginPath(); ctx.arc(Math.random()*W, Math.random()*H*0.8, Math.random()*1.5,0,6.28); ctx.fill();}
ctx.shadowColor='#ef4444'; ctx.shadowBlur=50; ctx.fillStyle='#ef4444'; ctx.beginPath(); ctx.arc(512,300,150,0,6.28); ctx.fill(); ctx.shadowBlur=0;
const g=ctx.createRadialGradient(452,250,10,512,300,150); g.addColorStop(0,'#ffe4e6'); g.addColorStop(0.3,'#ff4444'); g.addColorStop(1,'#7f1d1d'); ctx.fillStyle=g; ctx.beginPath(); ctx.arc(512,300,140,0,6.28); ctx.fill();
ctx.fillStyle='#fff'; ctx.font='bold 20px Inter'; ctx.fillText(prompt.slice(0,35),20,H-10);
return c.toDataURL();
}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function add(role, text, img, isCode){
const msgs=document.getElementById('messages'); msgs.classList.remove('hidden'); document.getElementById('hero').classList.add('hidden');
const d=document.createElement('div'); d.className='flex gap-3';
if(role==='user'){
d.innerHTML=`<div class="w-7 h-7 rounded-full bg-white/10 flex items-center justify-center text-[10px] shrink-0">You</div><div class="flex-1 bg-[#2a2a2e] px-4 py-3 rounded-[18px] rounded-tl-[4px] text-[14px]">${esc(text)}</div>`;
}else{
let ex='';
if(img){ ex=`<img src="${img}" class="rounded-[14px] mt-3 w-full max-w-[500px] border border-white/10"><div class="mt-2"><a href="${img}" download="red-moon.png" class="mono text-[11px] px-3 py-1.5 rounded-full bg-white text-black">Download</a></div>`; }
else if(isCode){ ex=`<div class="mt-3 bg-[#111] border border-white/10 rounded-[12px] p-3"><pre class="mono text-[11px] whitespace-pre-wrap">${esc(text)}</pre></div><button onclick="navigator.clipboard.writeText(\`${esc(text).replace(/`/g,'\\`')}\`);this.innerText='Copied'" class="mt-2 mono text-[11px] px-3 py-1.5 rounded-full bg-white text-black">Copy Code</button>`; text='Here is code:'; }
d.innerHTML=`<div class="w-7 h-7 rounded-full bg-gradient-to-br from-red-200 to-red-900 flex items-center justify-center shrink-0 text-[10px]">🌕</div><div class="flex-1"><div class="bg-white/[.05] border border-white/10 px-4 py-3 rounded-[18px] rounded-tl-[4px] text-[14px] leading-[21px] whitespace-pre-wrap">${esc(text)}${ex}</div></div>`;
}
msgs.appendChild(d); document.getElementById('chatArea').scrollTop=999999;
}
function demo(t){document.getElementById('inp').value=t; send();}
function send(){
const inp=document.getElementById('inp'); let txt=inp.value.trim(); if(!txt) return; inp.value='';
const low=txt.toLowerCase();

// REAL LOGIC FIXED - ORDER MATTERS
const isCode = low.includes('code') || low.includes('html') || low.includes('css') || low.includes('javascript') || low.includes('python');
const isImage = (low.includes('generate image') || low.includes('create image') || low.includes('draw image') || low.startsWith('image of') || (low.includes('image') && (low.includes('beach') || low.includes('city') || low.includes('moon') || low.includes('anime') || low.includes('portrait') || low.includes('cyberpunk'))));

if(isCode){
add('user', txt);
add('ai', `<!DOCTYPE html>
<html>
<head><title>Red Moon</title>
<style>body{background:#040405;color:#fff;font-family:Inter;display:grid;place-items:center;min-height:100vh;margin:0} .moon{width:200px;height:200px;border-radius:50%;background:radial-gradient(at 30% 30%,#ffe4e6,#ef4444 20%,#7f1d1d 60%,#000);box-shadow:0 0 60px rgba(239,68,68,.5)}</style>
</head>
<body>
<div class="moon"></div>
<h1>RED MOON AI</h1>
<p>My Gen - No Pollinations</p>
</body>
</html>`, null, true);
}
else if(isImage){
add('user', txt);
const clean=txt.replace(/generate image of|image of|create image/gi,'').trim() || 'red moon';
const data=myGen(clean);
add('ai', `Generated with MY GEN (no pollinations)\nPrompt: ${clean}`, data, false);
}
else {
// CHAT - For Why, What, How, etc
add('user', txt);
let answer='';
if(low==='why' || low.includes('why')){
answer=`Why you asked "${txt}"?

Red Moon happens because:

1. Lunar Eclipse - Earth shadow falls on Moon, Rayleigh scattering makes it red
2. Blood Moon - Same as total lunar eclipse
3. Cultural - Many stories

In Tamil: Raththa Nila (Raththa = Blood, Nila = Moon) - Surya velicham scattering.

Ask anything - I will chat, not make stupid image.`;
} else {
answer=`You said: "${txt}"

I am Red Moon AI - Fixed version:

• "Why / What / How / Explain" → I CHAT (like this)
• "Write code / HTML" → I give CODE
• "Generate image of ..." → I generate IMAGE with my canvas gen (no pollinations)

Try now - No more fool!`;
}
add('ai', answer);
}
}
document.getElementById('inp').addEventListener('keydown',e=>{if(e.key==='Enter') send();});
function newChat(){document.getElementById('messages').innerHTML=''; document.getElementById('messages').classList.add('hidden'); document.getElementById('hero').classList.remove('hidden');}
</script>
</body>
</html>
