<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>RED MOON AI</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="manifest" href="data:application/json;base64,eyJuYW1lIjoiUkVEIE1PT04gQUkiLCJzaG9ydF9uYW1lIjoiUk1BSSIsInN0YXJ0X3VybCI6Ii4iLCJkaXNwbGF5Ijoic3RhbmRhbG9uZSIsImJhY2tncm91bmRfY29sb3IiOiIjMDQwNDA1IiwidGhlbWVfY29sb3IiOiIjMDQwNDA1In0=">
<meta name="theme-color" content="#040405">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
*{font-family:Inter,system-ui,-apple-system; -webkit-tap-highlight-color:transparent}
body{background:#040405; overscroll-behavior:none}
#pc{position:fixed; inset:0; pointer-events:none; z-index:0}
.moon{width:220px; height:220px; border-radius:50%; background:radial-gradient(60% 60% at 30% 25%, #ffbbbb, #ef4444 22%, #7f1d1d 58%, #000 85%); box-shadow:0 0 90px rgba(239,68,68,.55), inset -30px -25px 60px rgba(0,0,0,.9), inset 10px 10px 30px rgba(255,255,255,.1); animation:breath 4s ease-in-out infinite; position:relative}
.eclipse{position:absolute; inset:0; border-radius:50%; background:radial-gradient(circle at 0% 50%, transparent 38%, #000 72%); mix-blend-mode:multiply; opacity:0; animation:ecl 15s ease-in-out infinite}
@keyframes breath{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
@keyframes ecl{0%,12%{transform:translateX(-130%); opacity:0}32%{transform:translateX(-18%); opacity:.92}58%{transform:translateX(28%); opacity:.92}78%,100%{transform:translateX(130%); opacity:0}}
.halo{position:absolute; inset:-45%; background:radial-gradient(circle, rgba(239,68,68,.28) 0%, transparent 62%); animation:breath 4s ease-in-out infinite reverse; pointer-events:none}
.scroll::-webkit-scrollbar{display:none}
</style>
</head>
<body class="h-[100dvh] flex flex-col text-white overflow-hidden antialiased">

<canvas id="pc"></canvas>
<div class="relative z-10 flex flex-col h-full">

<div class="h-[34px] flex items-center justify-between px-6 text-[15px] font-semibold shrink-0"><span id="clock">9:41</span><div class="flex items-center gap-1.5 text-[11px]"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><span class="border border-white/70 px-1.5 py-0.5 rounded-[6px] text-[10px] font-bold">78%</span></div></div>

<div class="mx-3 h-[54px] rounded-[18px] bg-white/[.07] backdrop-blur-2xl border border-white/10 flex items-center justify-between px-4 shrink-0">
<div class="flex items-center gap-3"><div class="w-9 h-9 rounded-full bg-gradient-to-br from-red-300 to-red-900 flex items-center justify-center text-[16px]">🌕</div><div><div class="font-bold text-[15px] leading-none">Red Moon AI</div><div class="text-[11px] text-white/50 font-mono mt-0.5">FINAL • ECLIPSE • 80 PARTICLES</div></div></div>
<div class="w-2 h-2 bg-red-400 rounded-full animate-pulse shadow-[0_0_10px_#ef4444]"></div>
</div>

<div class="flex-1 overflow-auto scroll px-4 pt-7 pb-2 flex flex-col items-center">

<div class="relative"><div class="halo"></div><div class="moon" id="moon"><div class="eclipse"></div></div></div>
<div class="mt-5 px-3 py-1.5 rounded-full bg-white/[.06] border border-white/10 text-[11px] font-mono text-red-200/70">Lunar: Waxing Gibbous • 87% • Eclipse in <span id="timer" class="text-red-300">00:12:44</span></div>

<div class="w-full mt-7 rounded-[22px] bg-[#121214]/90 backdrop-blur-xl border border-white/10 p-4">
<div class="flex items-center justify-between"><span class="font-semibold text-[15px]">Tonight's Insights</span><span class="text-[10px] px-2 py-1 rounded-full bg-red-500/15 border border-red-500/20 text-red-300">3 LIVE</span></div>
<div class="grid grid-cols-3 gap-2.5 mt-3.5">
<button onclick="ask('Generate Art')" class="rounded-[16px] bg-white/[.06] border border-white/10 p-3.5 flex flex-col items-center gap-2 active:scale-[.96] transition"><span class="text-[22px]">🌙</span><span class="text-[11px] font-medium">Generate Art</span></button>
<button onclick="ask('Analyze Mood')" class="rounded-[16px] bg-white/[.06] border border-white/10 p-3.5 flex flex-col items-center gap-2 active:scale-[.96] transition"><span class="text-[22px]">✨</span><span class="text-[11px] font-medium">Analyze Mood</span></button>
<button onclick="ask('Create Prompt of red moon city cyberpunk 8k')" class="rounded-[16px] bg-red-500/10 border border-red-500/25 p-3.5 flex flex-col items-center gap-2 active:scale-[.96] transition"><span class="text-[22px]">⚡</span><span class="text-[11px] font-medium text-red-200">Create Prompt</span></button>
</div>
</div>

<div class="w-full mt-3 rounded-[22px] bg-[#121214]/90 backdrop-blur-xl border border-white/10 p-4">
<div class="font-semibold text-[15px]">Recent Creations</div>
<div id="recent" class="grid grid-cols-2 gap-2.5 mt-3">
<div class="rounded-[16px] overflow-hidden bg-black border border-white/10"><div class="aspect-[16/10] bg-gradient-to-br from-red-900/60 to-black"></div><div class="p-2.5 text-[11px] text-white/60">Neon City Dream • 2h ago</div></div>
<div class="rounded-[16px] overflow-hidden bg-black border border-white/10"><div class="aspect-[16/10] bg-gradient-to-br from-red-900/30 to-black flex items-center justify-center text-[26px]">🌕</div><div class="p-2.5 text-[11px] text-white/60">Portrait Study • 5h ago</div></div>
</div>
</div>

<div id="chat" class="w-full mt-4 space-y-3 hidden"></div>
<div class="h-6 shrink-0"></div>
</div>

<div class="shrink-0 p-3 pb-[max(12px,env(safe-area-inset-bottom))] bg-gradient-to-t from-black via-black/80 to-transparent">
<div class="rounded-full bg-[#1e1e21]/90 backdrop-blur-2xl border border-red-500/25 flex items-center gap-2 px-3 py-2.5 shadow-[0_0_40px_rgba(239,68,68,.18)]">
<button class="w-8 h-8 rounded-full bg-white/5 flex items-center justify-center text-white/50"><i class="fa-solid fa-plus text-[12px]"></i></button>
<input id="inp" placeholder="Ask Red Moon AI anything..." class="flex-1 bg-transparent outline-none text-[15px] placeholder:text-white/30">
<div id="wave" class="hidden flex gap-[3px] items-center mr-1"><span class="w-[3px] h-3 bg-red-400 rounded-full animate-[wave_.5s_ease-in-out_infinite]"></span><span class="w-[3px] h-3 bg-red-400 rounded-full animate-[wave_.5s_.1s_ease-in-out_infinite]"></span><span class="w-[3px] h-3 bg-red-400 rounded-full animate-[wave_.5s_.2s_ease-in-out_infinite]"></span><span class="w-[3px] h-3 bg-red-400 rounded-full animate-[wave_.5s_.3s_ease-in-out_infinite]"></span></div>
<button id="mic" onpointerdown="holdStart()" onpointerup="holdEnd()" onpointerleave="holdEnd()" class="w-8 h-8 rounded-full flex items-center justify-center text-white/60 active:text-red-400 transition"><i class="fa-solid fa-microphone text-[16px]"></i></button>
<button onclick="send()" class="w-[44px] h-[44px] rounded-full bg-gradient-to-br from-red-500 to-red-700 text-white flex items-center justify-center shadow-[0_0_24px_rgba(239,68,68,.6)] active:scale-[.88] transition"><i class="fa-solid fa-arrow-up text-[16px]"></i></button>
</div>
<div class="flex justify-center mt-3"><div class="h-1.5 w-36 bg-white rounded-full opacity-90"></div></div>
</div>

</div>

<script>
// Clock
setInterval(()=>{let d=new Date(); document.getElementById('clock').textContent=d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',hour12:false})},1000);

// Particles 80
const c=document.getElementById('pc'), ctx=c.getContext('2d'); function rs(){c.width=innerWidth; c.height=innerHeight} rs(); addEventListener('resize',rs);
let ps=[...Array(80)].map(()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,vx:(Math.random()-.5)*.28,vy:(Math.random()-.5)*.28,s:Math.random()*1.4+.3,o:Math.random()*.55+.25}));
(function loop(){ctx.clearRect(0,0,c.width,c.height); ps.forEach(p=>{p.x+=p.vx; p.y+=p.vy; if(p.x<0||p.x>c.width) p.vx*=-1; if(p.y<0||p.y>c.height) p.vy*=-1; ctx.beginPath(); ctx.arc(p.x,p.y,p.s,0,6.283); ctx.fillStyle=`rgba(239,68,68,${p.o})`; ctx.shadowColor='#ef4444'; ctx.shadowBlur=6; ctx.fill(); ctx.shadowBlur=0}); requestAnimationFrame(loop)})();

// Timer
let t=764; setInterval(()=>{t--; let m=Math.floor(t/60), s=t%60; document.getElementById('timer').textContent=`00:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`; if(t<=0) t=900},1000);

// Gyro
if(window.DeviceOrientationEvent){window.addEventListener('deviceorientation',e=>{let el=document.getElementById('moon'); if(!el) return; el.style.transform=`perspective(500px) rotateX(${(e.beta||0)/14}deg) rotateY(${(e.gamma||0)/14}deg) scale(1.05)`},true)}

// Haptic
let vib=m=>navigator.vibrate&&navigator.vibrate(m);

// Chat
function addMsg(txt,isUser,img){
let ch=document.getElementById('chat'); ch.classList.remove('hidden');
let d=document.createElement('div');
if(isUser){d.className='ml-auto max-w-[82%] bg-red-600 px-4 py-3 rounded-[20px] rounded-br-[6px] text-[14px] shadow'; d.textContent=txt}
else{d.className='mr-auto max-w-[86%] bg-white/[.08] border border-white/10 px-4 py-3 rounded-[20px] rounded-bl-[6px] text-[14px]'; if(img){d.innerHTML=`<img src="${img}" class="rounded-[14px] w-full mb-2.5"><div class="text-[13px] leading-[18px]">${txt}</div>`} else {d.textContent=txt}}
ch.appendChild(d); ch.scrollIntoView({behavior:'smooth', block:'end'}); vib(20);
}
function ask(txt){document.getElementById('inp').value=txt; send()}
function send(){
let inp=document.getElementById('inp'); let txt=inp.value.trim(); if(!txt) return; inp.value=''; vib(25);
let isImg=/(art|image|create|city|prompt|generate|moon|phase|lunar)/i.test(txt);
if(isImg){let url='https://image.pollinations.ai/prompt/'+encodeURIComponent(txt+' red moon cinematic ultra detailed 8k')+'?width=700&height=500&model=flux&seed='+Date.now(); addMsg(txt,true); setTimeout(()=>{addMsg('🌕 Generated • Flux • 4K • Eclipse: active • Particles: '+ps.length, false, url); let r=document.getElementById('recent'); let card=document.createElement('div'); card.className='rounded-[16px] overflow-hidden bg-black border border-red-500/20 animate-[pop_.4s_ease]'; card.innerHTML=`<img src="${url}" class="aspect-[16/10] object-cover w-full"><div class="p-2.5 text-[11px] text-white/60">${txt.slice(0,18)} • now</div>`; r.prepend(card)},650)}
else{addMsg(txt,true); setTimeout(()=>addMsg('🌕 '+txt+' - Done! Tap Create Prompt for image.',false),350)}
}
document.getElementById('inp').addEventListener('keydown',e=>{if(e.key==='Enter') send()});

// Mic hold
let holdT; function holdStart(){document.getElementById('wave').classList.remove('hidden'); document.getElementById('mic').classList.add('text-red-400'); vib(15); holdT=setTimeout(()=>{holdEnd(); ask('Create image of red moon eclipse over cyberpunk city')},1100)}
function holdEnd(){document.getElementById('wave').classList.add('hidden'); document.getElementById('mic').classList.remove('text-red-400'); clearTimeout(holdT)}
</script>
<style>@keyframes wave{0%,100%{height:10px}50%{height:22px}} @keyframes pop{0%{transform:scale(.9); opacity:0}100%{transform:scale(1); opacity:1}}</style>
</body>
</html>
